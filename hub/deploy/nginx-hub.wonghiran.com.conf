# วางที่ /etc/nginx/sites-enabled/hub.wonghiran.com.conf แล้ว: nginx -t && systemctl reload nginx
# จากนั้น: certbot --nginx -d hub.wonghiran.com  (certbot จะเพิ่ม HTTPS ให้เอง เหมือน workpath-api)
server {
    listen 80;
    server_name hub.wonghiran.com;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

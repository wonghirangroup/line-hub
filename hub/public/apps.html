<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALL APP</title>
<link rel="icon" href="/verify/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/verify/assets/hub.css">
<style>
body { padding:0 0 calc(30px + env(safe-area-inset-bottom)); }
  main { max-width:760px; padding:calc(12px + env(safe-area-inset-top)) 14px 24px; }
  .search { position:sticky; top:0; z-index:5; padding:8px 0 10px; background:linear-gradient(180deg,var(--bg) 75%,rgba(243,248,255,0)); }
  input[type=search] { width:100%; font-size:1.05rem; padding:14px 18px; border-radius:99px; border:1.5px solid var(--line); box-shadow:var(--shadow-sm); }
  h2 { font-size:.82rem; color:var(--faint); letter-spacing:.07em; margin:18px 6px 8px; text-transform:uppercase; display:flex; align-items:center; gap:7px; }
  h2::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--blue2); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  a.card { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:118px; padding:14px 10px; margin:0; text-decoration:none; color:var(--ink); text-align:center; border-radius:var(--r-lg); }
  a.card:active { transform:scale(.97); }
  a.card:hover { box-shadow:var(--shadow); border-color:#CFE0FA; }
  a.card .ic { width:54px; height:54px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; background:var(--tint); }
  a.card .nm { font-weight:800; font-size:.95rem; line-height:1.25; word-break:break-word; }
  a.card .tp { font-size:.72rem; color:var(--faint); font-weight:700; }
  .note { background:var(--info-bg); color:var(--blue); border-radius:var(--r-lg); padding:12px 16px; margin:8px 0; font-size:.92rem; line-height:1.5; font-weight:600; }
  .note a { color:var(--blue); font-weight:800; }
  .empty, .state { text-align:center; color:var(--muted); padding:30px 10px; }
</style>
</head>
<body>
<main>
  <section class="hero"><div class="txt"><h1>ALL APP</h1><p>ทุกเว็บไซต์และระบบของคุณ รวมไว้ที่เดียว กดเข้าได้เลย</p><div class="who" id="who"></div></div><img class="mascot" src="/verify/assets/owl.webp" alt="" aria-hidden="true"></section>
  <div class="search"><input type="search" id="q" placeholder="ค้นหาระบบหรือเว็บไซต์…" aria-label="ค้นหา" autocomplete="off" hidden></div>
  <div class="state" id="state">กำลังโหลด…</div>
  <div class="note" id="verifyNote" hidden>ยังไม่ได้ยืนยันตัวตนพนักงาน — ตอนนี้เห็นเฉพาะลิงก์สาธารณะ · <a href="/verify">ยืนยันตัวตนพนักงาน</a> เพื่อดูระบบของคุณเพิ่ม</div>
  <div id="groups"></div>
  <div class="empty" id="empty" hidden>ไม่พบที่ตรงกับคำค้น</div>
</main>

<script src="/verify/config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var apps = [], idToken = '';
  // จัดกลุ่มตามสิทธิ์ที่เห็น — เรียงจากของทุกคน → ของพนักงาน → หลังบ้าน
  var GROUPS = [
    ['guest', 'สำหรับทุกคน'], ['', 'ของฉัน (พนักงาน)'], ['staff', 'ของฉัน (พนักงาน)'], ['driver', 'คนขับ'], ['admin', 'ผู้ดูแลระบบ (หลังบ้าน)'], ['superadmin', 'superadmin']
  ];

  function el(tag, props, kids) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { if (k === 'text') e.textContent = props[k]; else if (k === 'class') e.className = props[k]; else e.setAttribute(k, props[k]); });
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  function href(a) { return a.type === 'liff' ? 'https://liff.line.me/' + a.liffId : a.url; }
  function groupKey(a) { return a.requiredRole === 'staff' ? '' : (a.requiredRole || ''); }

  function render() {
    var q = $('q').value.trim().toLowerCase(), box = $('groups'); box.textContent = '';
    var shown = 0, seen = {};
    GROUPS.forEach(function (g) {
      var title = g[1]; if (seen[title]) return;
      var list = apps.filter(function (a) { var k = groupKey(a), t = (GROUPS.filter(function (x) { return x[0] === k; })[0] || [])[1]; return t === title && (!q || (a.name + ' ' + (a.icon || '')).toLowerCase().indexOf(q) >= 0); });
      seen[title] = true;
      if (!list.length) return;
      box.appendChild(el('h2', { text: title }));
      var grid = el('div', { class: 'grid' });
      list.forEach(function (a) {
        var link = el('a', { class: 'card', href: href(a), rel: 'noopener' }, [el('span', { class: 'ic', text: a.icon || '🔗' }), el('span', { class: 'nm', text: a.name }), el('span', { class: 'tp', text: a.type === 'liff' ? 'เปิดใน LINE' : 'เว็บไซต์' })]);
        if (a.type !== 'liff') link.setAttribute('target', '_blank');
        grid.appendChild(link); shown++;
      });
      box.appendChild(grid);
    });
    $('empty').hidden = shown > 0 || !apps.length;
  }

  function fail(t) { $('state').textContent = t; $('state').hidden = false; }

  if (!window.HUB_CONFIG || !window.HUB_CONFIG.liffId) { fail('ระบบยังไม่ได้ตั้งค่า LIFF'); return; }
  liff.init({ liffId: window.HUB_CONFIG.liffId }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    if (!idToken) { fail('ไม่ได้รับสิทธิ์จาก LINE — เปิดจากแอป LINE หรือเข้าสู่ระบบอีกครั้ง'); return; }
    return fetch('/api/me', { headers: { Authorization: 'Bearer ' + idToken } }).then(function (r) { return r.json().then(function (j) { return { status: r.status, json: j }; }); }).then(function (r) {
      if (r.status !== 200) { fail('โหลดรายการไม่สำเร็จ กรุณาลองใหม่'); return; }
      var d = r.json.data; apps = d.apps || [];
      $('state').hidden = true; $('q').hidden = false;
      $('who').textContent = d.user ? d.user.displayName : 'ผู้เยี่ยมชม';
      $('verifyNote').hidden = !!d.user;
      if (!apps.length) { fail('ยังไม่มีระบบให้แสดง'); return; }
      render();
    });
  }).catch(function () { fail('เริ่มต้น LINE ไม่สำเร็จ กรุณาลองใหม่'); });
  $('q').addEventListener('input', render);
})();
</script>
</body>
</html>

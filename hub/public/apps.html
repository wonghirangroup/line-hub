<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALL APP</title>
<style>
  :root { --bg:#eef4ff; --surface:#fff; --ink:#1b2745; --muted:#5b6b8c; --line:#d6e2f6; --navy:#0B1B4D; --blue:#1D6FE0; --chip:#e6f0ff; --shadow:0 6px 18px rgba(36,75,131,.10); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0d1426; --surface:#151f37; --ink:#e6ecfa; --muted:#9db0d3; --line:#26335a; --navy:#cfe0ff; --blue:#6aa3ff; --chip:#172a52; --shadow:none; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:linear-gradient(170deg,var(--bg),var(--bg)); color:var(--ink); font-family:'Noto Sans Thai','Leelawadee UI',Tahoma,system-ui,sans-serif; padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom)); }
  main { max-width:760px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  h1 { font-size:1.4rem; margin:0; color:var(--navy); }
  .who { color:var(--muted); font-size:.85rem; margin-left:auto; text-align:right; }
  .search { position:sticky; top:0; z-index:2; padding:6px 0 10px; background:var(--bg); }
  input[type=search] { width:100%; font:inherit; font-size:1.05rem; padding:13px 16px; border-radius:16px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); }
  input:focus-visible, a:focus-visible, button:focus-visible { outline:3px solid #9cc4ff; outline-offset:2px; }
  h2 { font-size:.9rem; color:var(--muted); letter-spacing:.02em; margin:18px 4px 8px; font-weight:800; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  a.card { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:112px; padding:14px 10px; background:var(--surface); border:1.5px solid var(--line); border-radius:20px; text-decoration:none; color:var(--ink); text-align:center; box-shadow:var(--shadow); }
  a.card:active { transform:scale(.97); }
  a.card .ic { font-size:2.1rem; line-height:1; }
  a.card .nm { font-weight:800; font-size:.95rem; line-height:1.25; word-break:break-word; }
  a.card .tp { font-size:.72rem; color:var(--muted); }
  .note { background:var(--chip); color:var(--blue); border-radius:16px; padding:12px 14px; margin:8px 0; font-size:.92rem; line-height:1.5; }
  .note a { color:var(--blue); font-weight:800; }
  .empty, .state { text-align:center; color:var(--muted); padding:30px 10px; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: no-preference) { a.card { transition:transform .12s; } }
</style>
</head>
<body>
<main>
  <header><h1>🧩 ALL APP</h1><span class="who" id="who"></span></header>
  <div class="search"><input type="search" id="q" placeholder="ค้นหาระบบหรือเว็บไซต์…" aria-label="ค้นหา" autocomplete="off" hidden></div>
  <div class="state" id="state">กำลังโหลด…</div>
  <div class="note" id="verifyNote" hidden>ยังไม่ได้ยืนยันตัวตนพนักงาน — ตอนนี้เห็นเฉพาะลิงก์สาธารณะ · <a href="/verify">ยืนยันตัวตนพนักงาน</a> เพื่อดูระบบของคุณเพิ่ม</div>
  <div id="groups"></div>
  <div class="empty" id="empty" hidden>ไม่พบที่ตรงกับคำค้น</div>
</main>

<script src="/verify/config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var apps = [], idToken = '';
  // จัดกลุ่มตามสิทธิ์ที่เห็น — เรียงจากของทุกคน → ของพนักงาน → หลังบ้าน
  var GROUPS = [
    ['guest', 'สำหรับทุกคน'], ['', 'ของฉัน (พนักงาน)'], ['staff', 'ของฉัน (พนักงาน)'], ['driver', 'คนขับ'], ['admin', 'ผู้ดูแลระบบ (หลังบ้าน)'], ['superadmin', 'superadmin']
  ];

  function el(tag, props, kids) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { if (k === 'text') e.textContent = props[k]; else if (k === 'class') e.className = props[k]; else e.setAttribute(k, props[k]); });
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  function href(a) { return a.type === 'liff' ? 'https://liff.line.me/' + a.liffId : a.url; }
  function groupKey(a) { return a.requiredRole === 'staff' ? '' : (a.requiredRole || ''); }

  function render() {
    var q = $('q').value.trim().toLowerCase(), box = $('groups'); box.textContent = '';
    var shown = 0, seen = {};
    GROUPS.forEach(function (g) {
      var title = g[1]; if (seen[title]) return;
      var list = apps.filter(function (a) { var k = groupKey(a), t = (GROUPS.filter(function (x) { return x[0] === k; })[0] || [])[1]; return t === title && (!q || (a.name + ' ' + (a.icon || '')).toLowerCase().indexOf(q) >= 0); });
      seen[title] = true;
      if (!list.length) return;
      box.appendChild(el('h2', { text: title }));
      var grid = el('div', { class: 'grid' });
      list.forEach(function (a) {
        var link = el('a', { class: 'card', href: href(a), rel: 'noopener' }, [el('span', { class: 'ic', text: a.icon || '🔗' }), el('span', { class: 'nm', text: a.name }), el('span', { class: 'tp', text: a.type === 'liff' ? 'เปิดใน LINE' : 'เว็บไซต์' })]);
        if (a.type !== 'liff') link.setAttribute('target', '_blank');
        grid.appendChild(link); shown++;
      });
      box.appendChild(grid);
    });
    $('empty').hidden = shown > 0 || !apps.length;
  }

  function fail(t) { $('state').textContent = t; $('state').hidden = false; }

  if (!window.HUB_CONFIG || !window.HUB_CONFIG.liffId) { fail('ระบบยังไม่ได้ตั้งค่า LIFF'); return; }
  liff.init({ liffId: window.HUB_CONFIG.liffId }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    if (!idToken) { fail('ไม่ได้รับสิทธิ์จาก LINE — เปิดจากแอป LINE หรือเข้าสู่ระบบอีกครั้ง'); return; }
    return fetch('/api/me', { headers: { Authorization: 'Bearer ' + idToken } }).then(function (r) { return r.json().then(function (j) { return { status: r.status, json: j }; }); }).then(function (r) {
      if (r.status !== 200) { fail('โหลดรายการไม่สำเร็จ กรุณาลองใหม่'); return; }
      var d = r.json.data; apps = d.apps || [];
      $('state').hidden = true; $('q').hidden = false;
      $('who').textContent = d.user ? d.user.displayName : 'ผู้เยี่ยมชม';
      $('verifyNote').hidden = !!d.user;
      if (!apps.length) { fail('ยังไม่มีระบบให้แสดง'); return; }
      render();
    });
  }).catch(function () { fail('เริ่มต้น LINE ไม่สำเร็จ กรุณาลองใหม่'); });
  $('q').addEventListener('input', render);
})();
</script>
</body>
</html>

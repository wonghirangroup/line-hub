# LINE Hub API — รันบนเซิร์ฟเวอร์ Smart-Jigsaw (nginx บนเครื่อง proxy เข้า 127.0.0.1:4100)
# ใช้งาน: cd /opt/line-hub/hub && docker compose up -d --build
services:
  hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    restart: unless-stopped
    env_file: .env            # ไฟล์ .env บนเซิร์ฟเวอร์ (ห้าม commit)
    environment:
      NODE_ENV: production
      PORT: "4100"
    ports:
      - "127.0.0.1:4100:4100" # เปิดเฉพาะในเครื่อง ให้ nginx เป็นคนรับจากภายนอก
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
